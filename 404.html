<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found &#8212; iter8d Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.notfound { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; background: var(--dark); }
.nf-num { font-family: "Space Grotesk",sans-serif; font-size: 180px; font-weight: 700; color: rgba(232,101,10,0.12); line-height: 1; margin-bottom: 20px; }
.nf-title { font-family: "Space Grotesk",sans-serif; font-size: 32px; font-weight: 700; color: white; margin-bottom: 14px; letter-spacing: -0.02em; }
.nf-sub { font-size: 16px; color: rgba(255,255,255,0.4); margin-bottom: 40px; line-height: 1.6; max-width: 360px; }
</style>
</head>
<body>
<div class="notfound">
  <div class="nf-num">4<span style="color:var(--orange)">0</span>4</div>
  <h1 class="nf-title">Page not found.</h1>
  <p class="nf-sub">The page you are looking for does not exist or has been moved.</p>
  <a href="/" class="btn btn-primary">Back to Home</a>
</div>
<script src="shared.js"></script>
</body>
</html>
